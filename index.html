<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMTeam – 6H de Fribourg 2027</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#0d0d10;--tx:#f2f2f4;--mut:#9a9aa5;--ac:#ff4256;--ac2:#34d399;--bd:#26262c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{background:linear-gradient(to bottom,transparent 35%,rgba(0,0,0,.72));color:#fff;border-bottom:1px solid var(--bd);min-height:100svh;display:flex;align-items:flex-end;justify-content:center;padding:56px 0 14px;text-align:center}
header .wrap{width:100%}
header h1,header p,.tag{text-shadow:0 2px 14px rgba(0,0,0,.85)}
#bgl{position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:no-repeat;background-position:center 16px;background-size:contain;background-size:max(220px,min(100vw,calc(100svh - 380px)));opacity:.75;will-change:opacity,filter}
#ct .ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#ct .bx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto}
#ct label{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 2px}
#ct input,#ct textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#ct textarea{min-height:110px}
.tag{display:inline-block;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;font-size:.8rem}
h1{font-size:clamp(2rem,8vw,3.4rem);margin:14px 0 6px;line-height:1.1}
header p{margin:0 auto;max-width:520px;opacity:.9}
.cd{display:flex;justify-content:center;gap:10px;margin-top:16px}
.cd div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 0;width:72px}
.cd b{display:block;font-size:1.7rem}.cd span{font-size:.7rem;text-transform:uppercase;opacity:.8}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5;overflow-x:auto;white-space:nowrap}
nav a{display:inline-block;padding:13px 14px;color:var(--tx);text-decoration:none;font-size:.92rem;font-weight:500}
section{padding:40px 0 8px}
h2{font-size:1.5rem;margin:0 0 12px}
h2::after{content:"";display:block;width:40px;height:3px;background:var(--ac);margin-top:6px;border-radius:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.av{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem;margin-bottom:8px}
.card h3{margin:0;font-size:1.05rem}.card small{color:var(--mut)}
.stat b{display:block;font-size:1.5rem;color:var(--ac2)}
ul.tl{list-style:none;padding:0;margin:0}
ul.tl li{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd)}
ul.tl time{min-width:64px;font-weight:700;color:var(--ac)}
.note{font-size:.82rem;color:var(--mut);margin-top:10px}
footer{margin-top:48px;background:var(--card);border-top:1px solid var(--bd);padding:28px 0 90px;text-align:center;color:var(--mut);font-size:.9rem}
a.btn,button.btn{display:inline-block;background:var(--ac);color:#fff;padding:10px 18px;border:0;border-radius:10px;text-decoration:none;font-weight:600;font-size:1rem;cursor:pointer}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#pn{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
#pn .in{max-width:640px;margin:0 auto}
#pn h3{margin:22px 0 8px}
#pn label{display:block;font-size:.8rem;color:var(--mut);margin:8px 0 2px}
#pn input,#pn textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
#pn textarea{min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
.row.one{grid-template-columns:1fr auto}
.bar{position:sticky;top:0;display:flex;gap:8px;justify-content:space-between;padding:8px 0;background:var(--bg);z-index:2}
.tabs{display:flex;gap:6px;margin:8px 0}
.msg{font-size:.9rem;color:var(--ac2);min-height:1.2em}
.evd{margin:10px auto 0!important;font-weight:600;font-size:1.05rem}
.vid{display:flex;align-items:center;gap:12px;color:var(--tx);text-decoration:none}
.vid .pl{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ac);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px}
.pod .st{flex:1;max-width:190px;text-align:center}
.pod .nm{font-weight:700;overflow-wrap:anywhere}.pod .am{font-size:.8rem;color:var(--mut);margin-bottom:6px;min-height:1.2em}
.pod .bl{border-radius:12px 12px 0 0;border:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:10px;font-size:1.6rem}
.pod .bl b{font-size:1.1rem;color:var(--mut)}
.p0{height:150px;border-color:#d4af37!important}.p1{height:115px;border-color:#c0c0c0!important}.p2{height:90px;border-color:#cd7f32!important}
ol.rk{list-style:none;margin:0;padding:0}
ol.rk li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}ol.rk li:last-child{border:0}
ol.rk .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
ol.rk .sn{flex:1;overflow-wrap:anywhere}ol.rk .sa{color:var(--ac2);font-weight:600;white-space:nowrap}

#ct{display:none}#ct.on{display:block}
#ct .act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#st{min-height:1.3em;font-size:.9rem;margin-top:8px}
.hp{position:absolute;left:-9999px}
</style>
